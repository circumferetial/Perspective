name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Build
        run: dotnet build Perspective.slnx -c Release

      # 主回归不含原生依赖；Oracle/SymPy 测试单独运行（见 README）
      - name: Main tests
        run: dotnet test Perspective.Tests -c Release --no-build

      # SymPy 后端测试：需要 python + sympy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SymPy
        run: python -m pip install sympy

      - name: SymPy backend tests
        run: dotnet test Perspective.Sympy.Tests -c Release --no-build
